<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#087642">
<title>برنامج تربية الحلال - تطوير</title>
<style>
:root{--bg:#0d1511;--card:#18231d;--card2:#101914;--line:#34453b;--text:#fff;--muted:#aeb9b2;--green:#24965a;--red:#9c3434;--orange:#9a6819;--blue:#246596}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
body.light{--bg:#f2f5f3;--card:#fff;--card2:#f7f9f8;--line:#d4ddd8;--text:#152019;--muted:#607067}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
header{background:linear-gradient(135deg,#087642,#32a866);padding:28px 14px;text-align:center;border-radius:0 0 28px 28px;color:#fff}
header h1{margin:0;font-size:32px}header p{margin:7px 0 0}.wrap{max-width:1100px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:17px}.stat,.mini{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 7px;text-align:center}.stat small,.mini small{color:var(--muted);display:block}.stat b{font-size:27px;display:block;margin-top:5px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.menu button{border:1px solid var(--line);background:var(--card);color:var(--text);min-height:125px;border-radius:22px;font-weight:700;font-size:18px;padding:10px}.menu .ico{font-size:34px;display:block;margin-bottom:8px}
.page{display:none}.page.active{display:block}.topbar{display:flex;align-items:center;gap:10px;margin-bottom:13px}.back,.primary,.secondary,.danger{border:0;border-radius:13px;padding:11px 15px;color:#fff}.back,.secondary{background:#34453b}.primary{background:var(--green)}.danger{background:var(--red)}h2{text-align:center;margin:5px 0 15px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tools{display:flex;gap:9px;margin:13px 0}.tools input{flex:1}
input,select,textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}textarea{min-height:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:13px;margin:9px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.badge{display:inline-block;border-radius:16px;padding:5px 9px;margin:3px;font-size:13px;background:#355044}.good{background:#145c36}.sick{background:#7a2929}.born{background:#215b8d}.late{background:#8a5a12}.sold{background:#665122}.dead{background:#5b3333}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{border:0;border-radius:10px;padding:7px 10px;color:#fff;background:#3b5145}.actions .del{background:#873737}
.empty{text-align:center;color:var(--muted);padding:30px}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:15px;overflow:auto}.modal.show{display:flex}.box{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:23px;padding:19px;max-height:92vh;overflow:auto}.box h3{text-align:center;margin-top:0}.box label{display:block;margin:10px 0 5px;color:var(--muted)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
.lock{position:fixed;inset:0;background:#0d1511;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.lockbox{width:min(480px,100%);background:#18231d;color:#fff;border:1px solid #34453b;border-radius:25px;padding:23px;text-align:center}.lockbox input{margin:7px 0;color:#fff;background:#101914}.device{word-break:break-all;font-size:13px;color:#b7c4bc}
.notice{background:#3f3219;border:1px solid #765e2c;padding:10px;border-radius:12px;margin:9px 0}.oknotice{background:#163e2a;border:1px solid #2d704c;padding:10px;border-radius:12px;margin:9px 0}
@media(max-width:720px){header h1{font-size:27px}.stats{grid-template-columns:repeat(2,1fr)}.menu{grid-template-columns:repeat(3,1fr);gap:8px}.menu button{min-height:105px;font-size:14px;padding:6px}.menu .ico{font-size:27px}.grid5,.grid4{grid-template-columns:repeat(2,1fr)}.tools{flex-direction:column}}
</style>
 <link rel="manifest" href="manifest.json">
<script>
if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('sw.js');
}
</script>
</head>
<body>
<div id="licenseLock" class="lock hidden" style="display:none!important"><div class="lockbox"><h2>🔐 تفعيل برنامج تربية الحلال</h2><p>رقم الجهاز</p><div id="deviceIdText" class="device"></div><input id="activationCode" placeholder="اكتب كود التفعيل"><button class="primary" onclick="activate()">تفعيل لمدة 3 شهور</button><div id="activationMsg" class="muted" style="margin-top:10px"></div></div></div>

<div id="home" class="page active">
<header><h1>🐑 برنامج تربية الحلال</h1><p>إدارة قطيع الضأن</p></header>
<div class="wrap">
<div id="licenseWarning"></div>
<div class="stats">
<div class="stat"><small>عدد الحلال الحالي</small><b id="dashStock">0</b></div><div class="stat"><small>النعاج المنتجة</small><b id="dashEwes">0</b></div>
<div class="stat"><small>المواليد</small><b id="dashBirths">0</b></div>
<div class="stat"><small>التنبيهات</small><b id="dashAlerts">0</b></div>
<div class="stat"><small>صافي الربح</small><b id="dashProfit">0</b></div>
</div>
<div class="menu" id="mainMenu"></div>
</div></div>

<div id="genericPage" class="page"><div class="wrap"><div class="topbar"><button class="back" onclick="goHome()">→ الرئيسية</button></div><h2 id="pageTitle"></h2><div id="pageBody"></div></div></div>

<div id="modal" class="modal"><div class="box"><h3 id="modalTitle"></h3><div id="modalBody"></div></div></div>

<script>
const K="tarbiat_alhalal_v1";
let db=JSON.parse(localStorage.getItem(K)||"null")||{
 herd:[],births:[],deaths:[],vaccines:[],sales:[],purchases:[],expenses:[],notes:[],stockAdds:[],movement:[],
 lastInventory:null,theme:"dark"
};
const menus=[
["🐑","سجل القطيع","herd"],["💙","المواليد","births"],["⚫","النفوق","deaths"],
["💉","التطعيمات","vaccines"],["🛒","البيع","sales"],["🧾","المشتريات","purchases"],
["💰","المصاريف","expenses"],["📝","الملاحظات","notes"],["📦","جرد الحلال","inventory"],
["🔍","تقرير النعاج","eweReport"],["📊","تقرير المواليد","birthReport"],["🔔","تنبيهات الحلال","alerts"],
["🏆","إنتاج النعاج","production"],["📅","موسم الولادات","season"],["📈","الربح والخسارة","profit"],
["📋","الملخص","summary"],["🕘","سجل الحركة","movement"],["👥","سجل المشترين","buyers"],
["💾","النسخة الاحتياطية","backup"],["🌙","ليلي / نهاري","theme"],["👤","نبذة عن صاحب المشروع","about"]
];
function save(){localStorage.setItem(K,JSON.stringify(db));renderDash()}
function uid(){return Date.now()+Math.random().toString(16).slice(2)}
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dObj(s){return new Date(s+"T12:00:00")}
function arDate(s){if(!s)return"-";return new Intl.DateTimeFormat("ar-SA-u-ca-gregory",{day:"numeric",month:"long",year:"numeric"}).format(dObj(s))}
function money(n){return Number(n||0).toLocaleString("ar-SA")+" ر.س"}
function daysBetween(a,b=new Date()){return Math.floor((b-dObj(a))/86400000)}
function addMonths(s,m){let d=dObj(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);let last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function ageText(s){let n=Math.max(0,daysBetween(s)),y=Math.floor(n/360),r=n%360,m=Math.floor(r/30),d=r%30,a=[];if(y)a.push(y+" سنة");if(m)a.push(m+" شهر");if(d||!a.length)a.push(d+" يوم");return a.join(" و ")}
function log(txt){db.movement.unshift({id:uid(),date:new Date().toISOString(),text:txt});if(db.movement.length>1000)db.movement.length=1000}
function openPage(type){if(type==="theme"){db.theme=db.theme==="light"?"dark":"light";applyTheme();save();return}document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));genericPage.classList.add("active");renderPage(type);scrollTo(0,0)}
function goHome(){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));home.classList.add("active");renderDash();scrollTo(0,0)}
function showModal(title,html){modalTitle.textContent=title;modalBody.innerHTML=html;modal.classList.add("show")}
function closeModal(){modal.classList.remove("show")}
function delConfirm(arr,id,label){if(!confirm("هل أنت متأكد من حذف "+label+"؟"))return;let i=arr.findIndex(x=>x.id===id);if(i>=0){arr.splice(i,1);log("حذف: "+label);save();renderPage(window.currentPage)}}
function applyTheme(){document.body.classList.toggle("light",db.theme==="light")}
function lastBirth(num){return db.births.filter(x=>x.mother===num).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function isSoldEwe(num){return db.sales.some(x=>x.type==="نعجة"&&x.number===num)}
function isDeadEwe(num){return db.deaths.some(x=>x.type==="نعجة"&&x.number===num)}
function activeHerd(){return db.herd.filter(x=>!isSoldEwe(x.number)&&!isDeadEwe(x.number))}
function birthTotals(){return db.births.reduce((a,x)=>({male:a.male+Number(x.male||0),female:a.female+Number(x.female||0)}),{male:0,female:0})}
function deathYoung(type){return db.deaths.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.count||1),0)}
function soldYoung(type){return db.sales.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.count||0),0)}
function stock(){
 let bt=birthTotals(),adds={نعجة:0,فحل:0,طلي:0,رخلة:0};
 db.stockAdds.forEach(x=>adds[x.type]=(adds[x.type]||0)+Number(x.count||0));
let ewes=db.herd.length+adds["نعجة"];
 let rams=adds["فحل"]-db.sales.filter(x=>x.type==="فحل").reduce((a,x)=>a+Number(x.count||0),0)-deathYoung("فحل");
 let males=bt.male+adds["طلي"]-soldYoung("طلي")-deathYoung("طلي");
 let females=bt.female+adds["رخلة"]-soldYoung("رخلة")-deathYoung("رخلة");
 return {ewes:Math.max(0,ewes),rams:Math.max(0,rams),males:Math.max(0,males),females:Math.max(0,females)};
}
function alerts(){
 let out=[],now=new Date();
 db.herd.forEach(e=>{let b=lastBirth(e.number);if(!b||isSoldEwe(e.number)||isDeadEwe(e.number))return;let due=dObj(addMonths(b.date,6)),late=dObj(addMonths(b.date,7));let diff=Math.ceil((due-now)/86400000);
 if(now>=late)out.push({kind:"ولادة",text:"⚠️ النعجة رقم "+e.number+" متأخرة في الولادة — مضى 7 شهور على آخر ولادة"});
 else if(diff<=30)out.push({kind:"ولادة",text:diff>0?"🐑 النعجة رقم "+e.number+" باقي "+diff+" يوم على موعد الولادة المتوقع":diff===0?"🐑 موعد الولادة المتوقع اليوم للنعجة رقم "+e.number:"🐑 النعجة رقم "+e.number+" تجاوزت الموعد المتوقع بـ "+Math.abs(diff)+" يوم"});
 });
 db.vaccines.forEach(v=>{let next=addMonths(v.date,v.type==="دود"?3:6),diff=Math.ceil((dObj(next)-now)/86400000);if(diff<=15)out.push({kind:"تطعيم",text:diff>0?"💉 "+v.type+" للحيوان "+v.animal+" باقي "+diff+" يوم":diff===0?"💉 "+v.type+" للحيوان "+v.animal+" مستحق اليوم":"⚠️ "+v.type+" للحيوان "+v.animal+" متأخر "+Math.abs(diff)+" يوم"})});
 return out;
}
function profit(){let s=db.sales.reduce((a,x)=>a+Number(x.total||0),0),p=db.purchases.reduce((a,x)=>a+Number(x.total||0),0),e=db.expenses.reduce((a,x)=>a+Number(x.amount||0),0);return {s,p,e,net:s-p-e}}
function renderDash(){let st=stock(),bt=birthTotals(),pr=profit();dashStock.textContent=st.ewes+st.rams+st.males+st.females;dashEwes.textContent=st.ewes;dashBirths.textContent=bt.male+bt.female;dashAlerts.textContent=alerts().length;dashProfit.textContent=Number(pr.net).toLocaleString("ar-SA");mainMenu.innerHTML=menus.map(m=>`<button onclick="openPage('${m[2]}')"><span class="ico">${m[0]}</span>${m[1]}${m[2]==="alerts"&&alerts().length?` (${alerts().length})`:""}</button>`).join("")}
function mini(label,val){return `<div class="mini"><small>${label}</small><b>${val}</b></div>`}
function renderPage(type){window.currentPage=type;let title=menus.find(x=>x[2]===type)?.[1]||"";pageTitle.textContent=title;let h="";
 if(type==="herd")h=herdPage(); if(type==="births")h=birthsPage(); if(type==="deaths")h=deathsPage(); if(type==="vaccines")h=vaccinesPage(); if(type==="sales")h=salesPage(); if(type==="purchases")h=purchasesPage(); if(type==="expenses")h=expensesPage(); if(type==="notes")h=notesPage(); if(type==="inventory")h=inventoryPage(); if(type==="eweReport")h=eweReportPage(); if(type==="birthReport")h=birthReportPage(); if(type==="alerts")h=alertsPage(); if(type==="production")h=productionPage(); if(type==="season")h=seasonPage(); if(type==="profit")h=profitPage(); if(type==="summary")h=summaryPage(); if(type==="movement")h=movementPage(); if(type==="buyers")h=buyersPage(); if(type==="backup")h=backupPage(); if(type==="about")h=aboutPage();pageBody.innerHTML=h}
function herdPage(){let a=activeHerd(),good=a.filter(x=>x.status==="سليمة").length,sick=a.filter(x=>x.status==="مريضة").length,born=a.filter(x=>lastBirth(x.number)).length,late=a.filter(x=>{let b=lastBirth(x.number);return b&&new Date()>=dObj(addMonths(b.date,7))}).length;return `<div class="grid5">${mini("القطيع",a.length)}${mini("السليمة",good)}${mini("المريضة",sick)}${mini("الوالدة",born)}${mini("المتأخرة",late)}</div><div class="tools"><input id="herdSearch" placeholder="🔍 ابحث برقم النعجة" oninput="filterHerd()"><button class="primary" onclick="addHerd()">＋ إضافة نعجة</button></div><div id="herdList">${herdCards(db.herd)}</div>`}
function herdCards(list){return list.length?list.map(e=>{let b=lastBirth(e.number),tags=`<span class="badge ${e.status==="سليمة"?"good":"sick"}">${e.status}</span>`;if(b)tags+=`<span class="badge born">والدة</span>`;if(b&&new Date()>=dObj(addMonths(b.date,7)))tags+=`<span class="badge late">متأخرة في الولادة</span>`;if(isSoldEwe(e.number))tags+=`<span class="badge sold">مباع</span>`;if(isDeadEwe(e.number))tags+=`<span class="badge dead">نافق</span>`;return `<div class="card" data-num="${e.number}"><div class="row"><b>🐑 نعجة رقم ${e.number}</b><span>${arDate(e.date)}</span></div><div>${tags}</div><div class="actions"><button onclick="editHerd('${e.id}')">✏️ تعديل</button><button class="del" onclick="delConfirm(db.herd,'${e.id}','النعجة رقم ${e.number}')">🗑️ حذف</button></div></div>`}).join(""):`<div class="empty">لا توجد نعاج مسجلة</div>`}
function filterHerd(){let q=herdSearch.value.trim();herdList.innerHTML=herdCards(db.herd.filter(x=>x.number.includes(q)))}
function addHerd(edit=null){let e=edit?db.herd.find(x=>x.id===edit):null;showModal(e?"تعديل نعجة":"إضافة نعجة",`<label>رقم النعجة</label><input id="fNum" value="${e?.number||""}" inputmode="numeric"><label>الحالة</label><select id="fStatus"><option ${e?.status!=="مريضة"?"selected":""}>سليمة</option><option ${e?.status==="مريضة"?"selected":""}>مريضة</option></select><label>تاريخ التسجيل</label><input id="fDate" type="date" value="${e?.date||today()}"><div class="buttons"><button class="primary" onclick="saveHerd('${edit||""}')">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function editHerd(id){addHerd(id)}
function saveHerd(id){let num=fNum.value.trim();if(!num)return alert("اكتب رقم النعجة");if(db.herd.some(x=>x.number===num&&x.id!==id))return alert("رقم النعجة مسجل من قبل");if(id){let e=db.herd.find(x=>x.id===id);e.number=num;e.status=fStatus.value;e.date=fDate.value;log("تعديل النعجة رقم "+num)}else{db.herd.unshift({id:uid(),number:num,status:fStatus.value,date:fDate.value});log("إضافة النعجة رقم "+num)}save();closeModal();renderPage("herd")}
function birthsPage(){let t=birthTotals();return `<div class="grid3">${mini("الطليان",t.male)}${mini("الرخال",t.female)}${mini("إجمالي المواليد",t.male+t.female)}</div><div class="tools"><input id="birthSearch" placeholder="بحث برقم الأم" oninput="renderPage('births')"><button class="primary" onclick="addBirth()">＋ إضافة ولادة</button></div>${db.births.length?db.births.map(b=>birthCard(b)).join(""):`<div class="empty">لا توجد ولادات</div>`}`}
function birthCard(b){let n=Number(b.male)+Number(b.female);return `<div class="card"><div class="row"><b>الأم ${b.mother} — الولادة رقم ${db.births.filter(x=>x.mother===b.mother&&x.date<=b.date).length}</b><span>${arDate(b.date)}</span></div><div>طليان: ${b.male} | رخال: ${b.female} | المجموع: ${n}</div><div>العمر الآن: <b>${ageText(b.date)}</b></div><div>الولادة القادمة المتوقعة: ${arDate(addMonths(b.date,6))}</div><div class="actions"><button onclick="addBirth('${b.id}')">✏️ تعديل</button><button class="del" onclick="delConfirm(db.births,'${b.id}','ولادة الأم ${b.mother}')">🗑️ حذف</button></div></div>`}
function addBirth(id=""){let b=id?db.births.find(x=>x.id===id):null;showModal(b?"تعديل ولادة":"إضافة ولادة",`<label>رقم الأم</label><input id="bMom" value="${b?.mother||""}" inputmode="numeric"><label>عدد المواليد</label><input id="bCount" value="${b?Number(b.male)+Number(b.female):1}" type="number" min="1"><label>تاريخ الولادة</label><input id="bDate" type="date" value="${b?.date||today()}"><label>عدد الطليان</label><input id="bMale" type="number" min="0" value="${b?.male||0}"><label>عدد الرخال</label><input id="bFemale" type="number" min="0" value="${b?.female||0}"><div class="buttons"><button class="primary" onclick="saveBirth('${id}')">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}
function saveBirth(id){let mom=bMom.value.trim(),male=Number(bMale.value),female=Number(bFemale.value),cnt=Number(bCount.value);if(!db.herd.some(x=>x.number===mom))return alert("رقم الأم غير موجود في سجل القطيع");if(male+female!==cnt)return alert("مجموع الطليان والرخال يجب أن يساوي عدد المواليد");let o={id:id||uid(),mother:mom,date:bDate.value,male,female};if(id)db.births[db.births.findIndex(x=>x.id===id)]=o;else db.births.unshift(o);log((id?"تعديل":"تسجيل")+" ولادة للنعجة "+mom);save();closeModal();renderPage("births")}
function simpleList(arr,formatter,empty="لا توجد سجلات"){return arr.length?arr.map(formatter).join(""):`<div class="empty">${empty}</div>`}
function deathsPage(){return `<div class="tools"><button class="primary" onclick="addDeath()">＋ تسجيل نفوق</button></div>${simpleList(db.deaths,x=>`<div class="card"><b>${x.type} ${x.number||""}</b> — العدد ${x.count} — ${arDate(x.date)}<div>${x.reason||""}</div><div class="actions"><button onclick="addDeath('${x.id}')">✏️ تعديل</button><button class="del" onclick="delConfirm(db.deaths,'${x.id}','سجل النفوق')">🗑️ حذف</button></div></div>`)}`}
function addDeath(id=""){let x=id?db.deaths.find(z=>z.id===id):null;showModal("تسجيل نفوق",`<label>النوع</label><select id="dType">${["نعجة","فحل","طلي","رخلة"].map(v=>`<option ${x?.type===v?"selected":""}>${v}</option>`).join("")}</select><label>رقم الحيوان (إن وجد)</label><input id="dNum" value="${x?.number||""}"><label>العدد</label><input id="dCount" type="number" min="1" value="${x?.count||1}"><label>تاريخ النفوق</label><input id="dDate" type="date" value="${x?.date||today()}"><label>سبب النفوق</label><input id="dReason" value="${x?.reason||""}"><div class="buttons"><button class="primary" onclick="saveDeath('${id}')">حفظ</button><button class="secondary" onclick="closeModal()">إلغاء</button></div>`)}

function saveExpense(id){let o={id:id||uid(),type:eType.value,other:eOther.value,amount:Number(eAmount.value),date:eDate.value,note:eNote.value};if(id)db.expenses[db.expenses.findIndex(x=>x.id===id)]=o;else db.expenses.unshift(o);log((id?"تعديل":"إضافة")+" مصروف");save();closeModal();renderPage("expenses")}

function inventoryPage(){let s=stock(),total=s.ewes+s.rams+s.males+s.females;return `<div class="grid4">${mini("عدد النعاج",s.ewes)}${mini("عدد الفحول",s.rams)}${mini("عدد الطليان",s.males)}${mini("عدد الرخال",s.females)}</div>${mini("المجموع الموجود في المراح",total)}<div class="card">آخر جرد: <b>${db.lastInventory?arDate(db.lastInventory):"لم يتم الجرد"}</b></div><div class="tools"><button class="primary" onclick="addStock()">＋ إضافة للمراح</button><button class="secondary" onclick="db.lastInventory=today();log('اعتماد الجرد');save();renderPage('inventory')">✓ اعتماد الجرد اليوم</button></div>${simpleList(db.stockAdds,x=>`<div class="card">${x.type} — العدد ${x.count} — ${arDate(x.date)} ${x.number?"— رقم "+x.number:""}<div class="actions"><button class="del" onclick="delConfirm(db.stockAdds,'${x.id}','إضافة المراح')">🗑️ حذف</button></div></div>`,"لا توجد إضافات يدوية للمراح")}`}

function eweReportPage(){return `<div class="tools"><input id="repNum" placeholder="اكتب رقم النعجة"><button class="primary" onclick="showEweReport()">عرض التقرير</button></div><div id="repOut"></div>`}
function showEweReport(){let num=repNum.value.trim(),e=db.herd.find(x=>x.number===num);if(!e){repOut.innerHTML=`<div class="empty">النعجة غير موجودة</div>`;return}let bs=db.births.filter(x=>x.mother===num).sort((a,b)=>b.date.localeCompare(a.date)),m=bs.reduce((a,x)=>a+Number(x.male),0),f=bs.reduce((a,x)=>a+Number(x.female),0),v=db.vaccines.filter(x=>x.animal===num),n=db.notes.filter(x=>x.ewe===num);repOut.innerHTML=`<div class="card"><h3>🐑 النعجة رقم ${num}</h3><div>الحالة: ${e.status} — تاريخ التسجيل: ${arDate(e.date)}</div><div>عدد الولادات: ${bs.length} | الطليان: ${m} | الرخال: ${f}</div>${bs[0]?`<div>آخر ولادة: ${arDate(bs[0].date)} | القادمة: ${arDate(addMonths(bs[0].date,6))}</div>`:""}</div>`+bs.map(b=>birthCard(b)).join("")+`<h3>التطعيمات</h3>`+simpleList(v,x=>`<div class="card">${x.type} — ${arDate(x.date)}</div>`)+`<h3>الملاحظات</h3>`+simpleList(n,x=>`<div class="card">${x.text} — ${arDate(x.date)}</div>`)}
function birthReportPage(){let t=birthTotals();return `<div class="grid3">${mini("إجمالي المواليد",t.male+t.female)}${mini("الطليان",t.male)}${mini("الرخال",t.female)}</div><div class="tools"><select id="brFilter" onchange="renderBirthReport()"><option value="all">الكل</option><option value="month">هذا الشهر</option><option value="year">هذه السنة</option></select></div><div id="brOut">${birthReportCards(db.births)}</div>`}
function birthReportCards(a){return simpleList(a,b=>`<div class="card"><b>الأم ${b.mother}</b> — ${arDate(b.date)}<div>طليان ${b.male} | رخال ${b.female} | المجموع ${Number(b.male)+Number(b.female)}</div><div>العمر: <b>${ageText(b.date)}</b></div></div>`)}
function renderBirthReport(){let now=new Date(),a=db.births.filter(b=>{let d=dObj(b.date);return brFilter.value==="all"||(brFilter.value==="month"&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())||(brFilter.value==="year"&&d.getFullYear()===now.getFullYear())});brOut.innerHTML=birthReportCards(a)}
function alertsPage(){let a=alerts();return a.length?a.map(x=>`<div class="notice">${x.text}</div>`).join(""):`<div class="oknotice">لا توجد تنبيهات حاليًا</div>`}
function productionPage(){let a=db.herd.map(e=>{let bs=db.births.filter(x=>x.mother===e.number),m=bs.reduce((z,x)=>z+Number(x.male),0),f=bs.reduce((z,x)=>z+Number(x.female),0),last=bs.sort((x,y)=>y.date.localeCompare(x.date))[0];return {n:e.number,c:bs.length,m,f,total:m+f,last}}).filter(x=>x.c);return simpleList(a,x=>`<div class="card"><b>🏆 النعجة ${x.n}</b><div>الولادات: ${x.c} | طليان: ${x.m} | رخال: ${x.f} | الإجمالي: ${x.total}</div><div>متوسط الإنتاج: ${(x.total/x.c).toFixed(2)} مولود لكل ولادة</div><div>آخر ولادة: ${arDate(x.last.date)} — آخر إنتاج: ${x.last.male} طلي + ${x.last.female} رخلة</div></div>`)}
function seasonPage(){let a=db.herd.map(e=>{let b=lastBirth(e.number);return b?{n:e.number,last:b.date,due:addMonths(b.date,6)}:null}).filter(Boolean).sort((x,y)=>x.due.localeCompare(y.due));return simpleList(a,x=>`<div class="card"><b>النعجة ${x.n}</b><div>آخر ولادة: ${arDate(x.last)}</div><div>الموعد المتوقع: ${arDate(x.due)}</div></div>`)}
function profitPage(){let p=profit();return `<div class="grid4">${mini("إجمالي البيع",money(p.s))}${mini("المشتريات",money(p.p))}${mini("المصاريف",money(p.e))}${mini(p.net>=0?"صافي الربح":"صافي الخسارة",money(Math.abs(p.net)))}</div>`}
function summaryPage(){let s=stock(),b=birthTotals(),p=profit(),sold=db.sales.reduce((a,x)=>a+Number(x.count),0),dead=db.deaths.reduce((a,x)=>a+Number(x.count),0);return `<div class="grid4">${mini("الحلال الحالي",s.ewes+s.rams+s.males+s.females)}${mini("المواليد",b.male+b.female)}${mini("النفوق",dead)}${mini("المباع",sold)}${mini("إجمالي البيع",money(p.s))}${mini("المشتريات",money(p.p))}${mini("المصاريف",money(p.e))}${mini(p.net>=0?"الربح":"الخسارة",money(Math.abs(p.net)))}</div>`}
function movementPage(){return simpleList(db.movement,x=>`<div class="card">${x.text}<div class="muted">${new Date(x.date).toLocaleString("ar-SA")}</div></div>`)}
function buyersPage(){let groups={};db.sales.forEach(s=>{let k=s.phone||s.buyer;(groups[k]??={buyer:s.buyer,phone:s.phone,items:[]}).items.push(s)});let a=Object.values(groups);return simpleList(a,g=>`<div class="card"><b>👤 ${g.buyer}</b><div>📱 ${g.phone}</div>${g.items.map(s=>`<div class="muted">${s.type} × ${s.count} — ${money(s.total)} — ${arDate(s.date)}</div>`).join("")}<div class="actions"><button onclick="messageBuyer('${g.phone}')">📩 إرسال رسالة</button><button onclick="location.href='tel:${g.phone}'">📞 اتصال</button></div></div>`,"لا يوجد مشترون")}
function messageBuyer(phone){let p=phone.replace(/\s/g,"");location.href=`sms:${p}?body=${encodeURIComponent("السلام عليكم")}`}
function backupPage(){return `<div class="card"><p>احفظ نسخة من جميع بيانات البرنامج، واسترجعها عند الحاجة.</p><div class="actions"><button onclick="downloadBackup()">💾 حفظ نسخة احتياطية</button><button onclick="document.getElementById('restoreFile').click()">♻️ استرجاع نسخة</button></div><input id="restoreFile" class="hidden" type="file" accept=".json" onchange="restoreBackup(this)"></div>`}
function downloadBackup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="نسخة-تربية-الحلال-"+today()+".json";a.click();URL.revokeObjectURL(a.href)}
function restoreBackup(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(confirm("سيتم استبدال البيانات الحالية. هل تريد المتابعة؟")){db=x;save();alert("تم استرجاع النسخة");goHome()}}catch(e){alert("ملف النسخة غير صالح")}};r.readAsText(f)}
function aboutPage(){return `<div class="card" style="text-align:center"><h2>👤 صاحب المشروع</h2><p><b>عزيز مصلح الجهني</b></p><p>الكنية: أبو خالد</p><p>الجوال: ٠٥٦٤٥٥٤٨٧٨</p></div>`}

/* التفعيل: مولد الأكواد المنفصل يستخدم نفس الخوارزمية والسر.
   هذه حماية عملية لنسخة ويب وليست ترخيصًا خادميًا غير قابل للكسر. */
const LICENSE_SECRET="ABUKHALID-TRB-2026-X7";
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36).toUpperCase()}
function deviceId(){let id=localStorage.getItem("halal_device_id");if(!id){id="AK-"+crypto.getRandomValues(new Uint32Array(2)).join("-");localStorage.setItem("halal_device_id",id)}return id}
function codeFor(dev,period){return (hash32(LICENSE_SECRET+"|"+dev+"|"+period)+"-"+hash32(period+"|"+dev+"|"+LICENSE_SECRET)).slice(0,17)}
function currentQuarter(d=new Date()){return d.getFullYear()+"Q"+(Math.floor(d.getMonth()/3)+1)}
function activate(){let dev=deviceId(),code=activationCode.value.trim().toUpperCase(),now=new Date();let periods=[];for(let i=0;i<8;i++){let d=new Date(now.getFullYear(),now.getMonth()+i*3,1);periods.push(currentQuarter(d))}let found=periods.find(p=>codeFor(dev,p)===code);if(!found){activationMsg.textContent="كود التفعيل غير صحيح";return}let end=new Date();end.setMonth(end.getMonth()+3);localStorage.setItem("halal_license_end",end.toISOString());localStorage.setItem("halal_license_code",code);licenseLock.classList.add("hidden");checkLicense();alert("تم التفعيل لمدة 3 شهور")}
function checkLicense(){let end=localStorage.getItem("halal_license_end"),now=new Date();if(!end||now>=new Date(end)){deviceIdText.textContent=deviceId();licenseLock.classList.remove("hidden");return}licenseLock.classList.add("hidden");let days=Math.ceil((new Date(end)-now)/86400000);licenseWarning.innerHTML=days<=7?`<div class="notice">🔐 باقي ${days} يوم على انتهاء التفعيل</div>`:""}
applyTheme();renderDash();licenseLock.classList.add("hidden");
</script>
</body>
